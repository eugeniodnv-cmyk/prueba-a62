<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba A62</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f4e5f">
<link rel="apple-touch-icon" href="icon.svg">
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ef;color:#222}h1{font-size:1.3rem}
.c{background:#fff;border-radius:10px;padding:12px;margin:10px 0}button{font-size:1rem;padding:10px 14px;margin:4px 0;border:0;border-radius:8px;background:#1f4e5f;color:#fff;width:100%}
.ok{color:#1a7f37}.ko{color:#b42318}pre{white-space:pre-wrap;font-size:.85rem}</style></head><body>
<h1>Prueba de app · Amargura 62</h1>
<p>Página de prueba temporal. No guarda datos reales.</p>
<div class="c"><b>1. Instalada como app:</b> <span id="inst"></span></div>
<div class="c"><b>2. Funciona sin conexión:</b> <span id="off"></span><br><small>Prueba: activa modo avión y vuelve a abrirla.</small></div>
<div class="c"><b>3. Datos guardados:</b><pre id="dat"></pre><button id="ap">Apuntar una visita</button></div>
<div class="c"><b>4. Avisos:</b> <span id="not"></span><button id="pn">Permitir y mandar un aviso de prueba</button></div>
<div class="c"><b>Resumen para mandar por WhatsApp:</b><pre id="res"></pre><button id="cp">Copiar resumen</button></div>
<script>
const $=i=>document.getElementById(i),now=()=>new Date().toLocaleString('es-ES');
const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
$('inst').innerHTML=inst?'<span class="ok">sí</span>':'<span class="ko">no (ábrela desde el icono)</span>';
$('off').innerHTML=navigator.onLine?'con conexión ahora':'<span class="ok">sí: abierta sin conexión</span>';
let d;try{d=JSON.parse(localStorage.getItem('p'))}catch(e){}
if(!d)d={primera:now(),t0:Date.now(),visitas:[],offline:0};
d.visitas.push(now()+(navigator.onLine?'':' (sin conexión)'));if(!navigator.onLine)d.offline++;
const save=()=>{try{localStorage.setItem('p',JSON.stringify(d))}catch(e){}};save();
function pinta(){const dd=((Date.now()-d.t0)/864e5).toFixed(1);
$('dat').textContent='Primera vez: '+d.primera+'\nDías guardando datos: '+dd+'\nVisitas: '+d.visitas.length+'\nAbierta sin conexión: '+d.offline+' veces\nÚltimas: '+d.visitas.slice(-3).join(' | ');
$('not').textContent='Notification' in window?Notification.permission:'no disponible';
$('res').textContent='PRUEBA APP\nMóvil: '+navigator.userAgent.replace(/.*?\((.*?)\).*/,'$1')+'\nInstalada: '+(inst?'sí':'no')+'\nDías con datos: '+dd+'\nVisitas: '+d.visitas.length+'\nSin conexión: '+d.offline+'\nAvisos: '+$('not').textContent+(d.aviso?' (aviso recibido '+d.aviso+')':'');}
pinta();
$('ap').onclick=()=>{d.visitas.push(now()+' (botón)');save();pinta()};
$('pn').onclick=async()=>{if(!('Notification' in window))return;const p=await Notification.requestPermission();
if(p==='granted'){const r=await navigator.serviceWorker.ready;await r.showNotification('Amargura 62',{body:'Aviso de prueba: funciona',icon:'icon.svg'});d.aviso=now();save()}pinta()};
$('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('res').textContent);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script></body></html>
